# Releases (stackr's RFC-0003, Releases and versioning). release-please keeps one release pull
# request open for the packages with unreleased changes. Merging it tags each one
# <package>-v<version>, updates its CHANGELOG.md and creates its GitHub release. Each released
# package is then built alone, as it is published, and its wheel and sdist are attached to its
# release with a build-provenance attestation. stackr ships no wheel. Publishing to PyPI is a
# later job here.

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      paths: ${{ steps.release.outputs.paths_released }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.path }})
    needs: release-please
    if: needs.release-please.outputs.paths != '' && needs.release-please.outputs.paths != '[]'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths) }}
    env:
      TAG: ${{ fromJSON(needs.release-please.outputs.releases)[format('{0}--tag_name', matrix.path)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.path != 'packages/stackr'
        with:
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        if: matrix.path != 'packages/stackr'
        with:
          auto-install: true
      - name: Build the package alone, as it is published
        if: matrix.path != 'packages/stackr'
        working-directory: ${{ matrix.path }}
        run: uv build --no-sources --out-dir dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: matrix.path != 'packages/stackr'
        with:
          subject-path: ${{ matrix.path }}/dist/*
      - name: Attach the wheel and sdist to the release
        if: matrix.path != 'packages/stackr'
        working-directory: ${{ matrix.path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*
